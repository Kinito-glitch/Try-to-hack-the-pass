<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Website</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* Password Screen Styles */
        #login-screen {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        #login-screen h2 {
            margin-bottom: 20px;
            color: #444;
        }

        #login-screen input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        #login-screen button {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        #login-screen button:hover {
            background-color: #5563c1;
        }

        #error-msg {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* Main Content Styles (Hidden by default) */
        #main-content {
            display: none;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        #main-content h1 {
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Password Entry Screen -->
    <div id="login-screen">
        <h2>Enter Password</h2>
        <input type="password" id="password-input" placeholder="Password...">
        <button onclick="checkPassword()">Submit</button>
        <div id="error-msg">Incorrect password, try again!</div>
    </div>

    <!-- Main Website Content (Hidden initially) -->
    <div id="main-content">
        <h1>🎉 Welcome to the Secret Site!</h1>
        <p>You successfully entered the correct password. This is your exclusive content area.</p>
        <p>Feel free to customize this page with your own text, images, or links!</p>
    </div>

    <script>
        // Set your password here
        const correctPassword = "mySecretPassword123";

        function checkPassword() {
            const userInput = document.getElementById("password-input").value;
            const loginScreen = document.getElementById("login-screen");
            const mainContent = document.getElementById("main-content");
            const errorMsg = document.getElementById("error-msg");

            if (userInput === correctPassword) {
                // Hide login screen and show main website content
                loginScreen.style.display = "none";
                mainContent.style.display = "block";
            } else {
                // Show error message
                errorMsg.style.display = "block";
                document.getElementById("password-input").value = ""; // Clear input
            }
        }

        // Optional: Allow pressing the "Enter" key to submit
        document.getElementById("password-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>

</body>
</html>
